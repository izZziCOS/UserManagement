version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: userdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: useradmin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - usernet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U useradmin -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: runner
    container_name: user-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: useradmin
      DB_PASSWORD: secretpassword
      DB_NAME: userdb
      ENV: development
    networks:
      - usernet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
    name: userdb-data

networks:
  usernet:
    name: user-management-network
    driver: bridge
